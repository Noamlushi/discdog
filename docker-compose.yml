services:
  mongo:
    image: mongo:7
    container_name: jgames-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: jgames
      MONGO_INITDB_ROOT_PASSWORD: jgames_dev_pw
      MONGO_INITDB_DATABASE: jgames
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
